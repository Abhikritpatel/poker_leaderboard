<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body> 
    <!-- 1. Leaderboard View -->
    <div id="leaderboard-view">
        <!-- Top Table Switcher -->
        <div class="header-bar">
            <div class="header-group-container">
                <span class="poker-icon">♠️</span>
                <select id="group_select" class="group-select">
                    <option value="main">Loading tables...</option>
                </select>
            </div>
            <button id="create_group_btn" class="btn-new-table">
                + New Table
            </button>
        </div>

        <div class="filter-container">
            <select id="time_frame_select">
                <option value="all"> All Time </option>
                <option value="week"> Past 7 days</option>
                <option value="month"> Past 30 days</option>
                <option value="custom"> Custom date range</option>
            </select>
            <div id="custom_date_controls">
                <input type="date" id="start_date">
                <span>TO</span>
                <input type="date" id="end_date">
                <button id="apply_custom_date_btn">Apply</button>
            </div>
        </div>

        <h1 id="leaderboard_title" class="leaderboard-title">Poker Hall of Fame 🏆</h1>
        
        <div id="leaderboard_display"> Loading leaderboard... </div>

        <button id="start-game-btn" class="btn-fab">
            +
        </button>
    </div>

    <!-- 2. Live Game Staging View -->
    <div id="live-game-view" class="hidden">
        <div class="live-view-header">
            <button id="cancel-game-btn" class="btn-cancel">Cancel</button>
            <h2 id="live_session_title" class="live-session-title">Live Session</h2>
            <div class="header-spacer"></div>
        </div>

        <div class="input-card game-config-card">
            <div class="game-config-row">
                <div class="flex-2">
                    <label for="game-date">Date</label>
                    <input type="date" id="game-date">
                </div>
                <div class="flex-1">
                    <label for="chip-ratio">Ratio</label>
                    <input type="number" id="chip-ratio" value="5">
                </div>
                <div class="flex-1">
                    <label for="buy-in-amt">Buy-in (₹)</label>
                    <input type="number" id="buy-in-amt" value="100">
                </div>
            </div>
        </div>

        <div class="roster-header">
            <h3 class="roster-title">Table Roster</h3>
            <div class="roster-badge">
                <span class="badge-label">Total Buy-ins:</span>
                <span id="roster-buyins-badge" class="badge-count">0</span>
            </div>
        </div>
        <div id="players-container"></div>

        <button id="add-player-btn" class="btn-add-player">
            + Seat a Player
        </button>

        <div class="input-card summary-card">
            <!-- Live Session Metrics Summary -->
            <div class="metrics-summary-grid">
                <div class="metric-box">
                    <div class="metric-title">Total Buy-ins</div>
                    <div id="live-total-buyins" class="metric-value metric-blue">0</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Total Pot</div>
                    <div id="live-total-pot" class="metric-value metric-gold">₹0</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Chips in Play</div>
                    <div id="live-total-chips" class="metric-value metric-purple">0</div>
                </div>
            </div>

            <div class="settlement-container">
                <h3 id="live-balance" class="live-balance-title">Discrepancy: Checking...</h3>
                <button id="submit-game-btn" class="btn-submit" disabled>
                    Math Doesn't Match
                </button>
            </div>
        </div>
    </div>

    <!-- 3. Player Row Template -->
    <template id="player-row-template">
        <div class="input-card player-row">
            <input type="text" class="p-name" placeholder="Name">
            
            <div class="p-buyins-col">
                <label>Buy-ins</label>
                <input type="number" class="p-buyins live-input" value="1" min="1">
            </div>
            
            <div class="p-chips-col">
                <label>End Chips</label>
                <input type="number" class="p-chips live-input" placeholder="0">
            </div>
            
            <button class="remove-btn">X</button>
        </div>
    </template>
</body>
</html>
