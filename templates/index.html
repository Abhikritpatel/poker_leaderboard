<!DOCTYPE html>
<html>
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Tracker</title>
    <style>
        /* 1. Deep Space Background */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117; /* Deep terminal black */
            color: #c9d1d9; /* Crisp off-white text */
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 2. The Input Card */
        .input-card {
            background-color: #161b22; /* Slightly elevated dark grey */
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            margin-bottom: 30px;
            border: 1px solid #30363d; /* Subtle metallic border */
        }

        /* 3. Sleek Inputs */
        label {
            font-weight: 600;
            font-size: 0.9em;
            color: #8b949e; /* Muted label text */
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1em;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #f85149; /* Sharp red glow when typing */
        }

        /* 4. Punchy Action Button */
        button {
            background-color: #da3633; /* Deep crimson */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #f85149;
        }
        button:active {
            transform: scale(0.98);
        }

        /* 5. The Leaderboard Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #161b22;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }
        th {
            background-color: #0d1117;
            font-weight: 600;
            color: #8b949e;
        }
        tr:nth-child(even) {
            background-color: #1c2128;
        }

        /* Container for table switcher & filters */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #161b22;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 25px;
            gap: 15px;
        }
        .filter-container {
            text-align: center;
            margin-bottom: 20px;
        }

        #time_frame_select {
            width: auto;
            margin-bottom: 0;
        }

        #custom_date_controls {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        #custom_date_controls input[type="date"] {
            width: auto;
            margin-bottom: 0;
        }
        #custom_date_controls button {
            width: auto;
        }
    </style>
</head>

<body> 
    <!-- 1. Leaderboard View -->
    <div id="leaderboard-view">
        <!-- Top Table Switcher -->
        <div class="header-bar">
            <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                <span style="font-size: 1.3em;">♠️</span>
                <select id="group_select" style="margin-bottom: 0; font-weight: bold; cursor: pointer;">
                    <option value="main">Loading tables...</option>
                </select>
            </div>
            <button id="create_group_btn" style="width: auto; padding: 9px 16px; font-size: 0.9em; background-color: #238636; border-radius: 6px; white-space: nowrap;">
                + New Table
            </button>
        </div>

        <div class="filter-container">
            <select id="time_frame_select">
                <option value="all"> All Time </option>
                <option value="week"> Past 7 days</option>
                <option value="month"> Past 30 days</option>
                <option value="custom"> Custom date range</option>
            </select>
            <div id="custom_date_controls">
                <input type="date" id="start_date">
                <span>TO</span>
                <input type="date" id="end_date">
                <button id="apply_custom_date_btn">Apply</button>
            </div>
        </div>

        <h1 id="leaderboard_title" style="text-align: center;">Poker Hall of Fame 🏆</h1>
        
        <div id="leaderboard_display"> Loading leaderboard... </div>

        <button id="start-game-btn" style="position: fixed; bottom: 30px; right: 30px; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); padding: 0;">
            +
        </button>
    </div>

    <!-- 2. Live Game Staging View -->
    <div id="live-game-view" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button id="cancel-game-btn" style="background: transparent; color: #f85149; width: auto; padding: 10px;">Cancel</button>
            <h2 id="live_session_title" style="margin: 0;">Live Session</h2>
            <div style="width: 70px;"></div>
        </div>

        <div class="input-card" style="margin-top: 20px;">
            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label>Date</label>
                    <input type="date" id="game-date">
                </div>
                <div style="flex: 1;">
                    <label>Ratio</label>
                    <input type="number" id="chip-ratio" value="5">
                </div>
                <div style="flex: 1;">
                    <label>Buy-in (₹)</label>
                    <input type="number" id="buy-in-amt" value="100">
                </div>
            </div>
        </div>

        <h3>Table Roster</h3>
        <div id="players-container"></div>

        <button id="add-player-btn" style="background: transparent; border: 2px dashed #30363d; color: #8b949e; margin-top: 10px;">
            + Seat a Player
        </button>

        <div class="input-card" style="margin-top: 30px; text-align: center; border-color: #3fb950;">
            <h3 id="live-balance" style="margin-top: 0; color: #f85149;">Discrepancy: Checking...</h3>
            <button id="submit-game-btn" style="background-color: #3fb950;" disabled>
                Math Doesn't Match
            </button>
        </div>
    </div>

    <!-- 3. Player Row Template -->
    <template id="player-row-template">
        <div class="input-card player-row" style="display: flex; gap: 10px; padding: 15px; margin-bottom: 10px; align-items: center;">
            <input type="text" class="p-name" placeholder="Name" style="flex: 2; margin-bottom: 0;">
            
            <div style="flex: 1;">
                <label style="font-size: 11px;">Buy-ins</label>
                <input type="number" class="p-buyins live-input" value="1" min="1" style="margin-bottom: 0;">
            </div>
            
            <div style="flex: 1.5;">
                <label style="font-size: 11px;">End Chips</label>
                <input type="number" class="p-chips live-input" placeholder="0" style="margin-bottom: 0;">
            </div>
            
            <button class="remove-btn" style="width: auto; padding: 10px; margin-bottom: 0;">X</button>
        </div>
    </template>

<script>
    // --- Group & State Management ---
    let currentGroupId = 'main';
    let currentGroupName = 'Main Table';
    let availableGroups = [];

    // Check URL parameters for ?table=slug or fallback to localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const tableFromUrl = urlParams.get('table');
    const tableFromStorage = localStorage.getItem('poker_active_table');
    if (tableFromUrl) {
        currentGroupId = tableFromUrl;
    } else if (tableFromStorage) {
        currentGroupId = tableFromStorage;
    }

    const groupSelect = document.getElementById('group_select');
    const createGroupBtn = document.getElementById('create_group_btn');
    const leaderboardTitle = document.getElementById('leaderboard_title');
    const liveSessionTitle = document.getElementById('live_session_title');

    function load_groups() {
        fetch('/api/groups')
            .then(res => res.json())
            .then(groups => {
                availableGroups = groups;
                groupSelect.innerHTML = '';
                
                // If currentGroupId is not in returned list, default to first or 'main'
                const match = groups.find(g => g.group_id === currentGroupId);
                if (!match && groups.length > 0) {
                    currentGroupId = groups[0].group_id;
                    currentGroupName = groups[0].name;
                } else if (match) {
                    currentGroupName = match.name;
                }

                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.group_id;
                    opt.textContent = g.name;
                    if (g.group_id === currentGroupId) opt.selected = true;
                    groupSelect.appendChild(opt);
                });

                update_titles();
                get_leaderboard(timeframeselect.value);
            })
            .catch(err => {
                console.error("Error loading groups:", err);
                get_leaderboard(timeframeselect.value);
            });
    }

    function update_titles() {
        const found = availableGroups.find(g => g.group_id === currentGroupId);
        currentGroupName = found ? found.name : 'Poker';
        leaderboardTitle.innerText = `${currentGroupName} 🏆`;
        liveSessionTitle.innerText = `Live Session (${currentGroupName})`;
    }

    groupSelect.addEventListener('change', () => {
        currentGroupId = groupSelect.value;
        localStorage.setItem('poker_active_table', currentGroupId);
        history.replaceState(null, '', `?table=${currentGroupId}`);
        update_titles();
        get_leaderboard(timeframeselect.value);
    });

    createGroupBtn.addEventListener('click', () => {
        const name = prompt("Enter a name for the new Poker Table (e.g. 'College Gang', 'Friday Crew'):");
        if (!name || !name.trim()) return;

        fetch('/api/groups', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim() })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'error') {
                alert("Error: " + data.message);
            } else {
                currentGroupId = data.group_id;
                localStorage.setItem('poker_active_table', currentGroupId);
                history.replaceState(null, '', `?table=${currentGroupId}`);
                load_groups();
            }
        })
        .catch(err => {
            console.error("Failed to create group:", err);
            alert("Server error creating table");
        });
    });

    // --- Navigation Views ---
    const leaderboardView = document.getElementById('leaderboard-view');
    const liveGameView = document.getElementById('live-game-view');
    const startGameBtn = document.getElementById('start-game-btn');
    const cancelGameBtn = document.getElementById('cancel-game-btn');

    startGameBtn.addEventListener('click', () => {
        leaderboardView.style.display = 'none';
        liveGameView.style.display = 'block';
        
        // Auto-populate today's date if empty
        const dateInput = document.getElementById('game-date');
        if (!dateInput.value) {
            dateInput.value = new Date().toISOString().split('T')[0];
        }
    });

    cancelGameBtn.addEventListener('click', () => {
        liveGameView.style.display = 'none';
        leaderboardView.style.display = 'block';
    });

    // --- Player Rows in Live Session ---
    const addPlayerBtn = document.getElementById('add-player-btn');
    const playerContainer = document.getElementById('players-container');
    const playerTemplate = document.getElementById('player-row-template');        

    function add_player_row() {
        const newrow = playerTemplate.content.cloneNode(true);
        const removebtn = newrow.querySelector('.remove-btn');
        removebtn.addEventListener('click', (event) => {
            event.target.closest('.player-row').remove();
            calculate_Balance();
        });
        playerContainer.appendChild(newrow);
    }

    addPlayerBtn.addEventListener('click', () => {
        add_player_row();
    });
    add_player_row();
    add_player_row();

    // --- Leaderboard Fetching ---
    function get_leaderboard(time_frame = 'all') {
        let url = `/api/leaderboard?group_id=${encodeURIComponent(currentGroupId)}&timeframe=${encodeURIComponent(time_frame)}`;
        if (time_frame.startsWith('custom&')) {
            url = `/api/leaderboard?group_id=${encodeURIComponent(currentGroupId)}&${time_frame}`;
        }

        fetch(url, { method: 'GET' })
            .then(response => response.json())
            .then(result => {
                if (!result || result.length === 0) {
                    document.getElementById('leaderboard_display').innerHTML = `
                        <div class="input-card" style="text-align: center; color: #8b949e;">
                            No games logged for <strong>${currentGroupName}</strong> in this timeframe yet.<br><br>
                            Click the <strong>+</strong> button below to log the first session!
                        </div>`;
                    return;
                }

                let tableHTML = "<table>";
                let headertext = "All Time Winning (INR)";
                if (time_frame == 'week') headertext = "Past 7 days";
                if (time_frame == 'month') headertext = "Past 30 days";
                if (time_frame.startsWith('custom')) headertext = "Custom Range";
                tableHTML += `<tr><th>Rank</th><th>Player</th><th>${headertext}</th></tr>`;

                for (let i = 0; i < result.length; i++) {
                    let player = result[i];
                    let scoreColor = (player.total_winning >= 0) ? "#3fb950" : "#f85149";
                    let emoji = "";
                    if (i === 0) emoji = "👑";
                    if (i === 1) emoji = "🥈";
                    if (i === 2) emoji = "🥉";
                    if (i === result.length - 1 && player.total_winning < 0) emoji = "💀";
                    tableHTML += `<tr><td>${i + 1}</td><td>${player.name} ${emoji}</td><td style="color: ${scoreColor}; font-weight: bold;">₹${player.total_winning.toLocaleString()}</td></tr>`;
                }
                tableHTML += "</table>";
                document.getElementById('leaderboard_display').innerHTML = tableHTML;
            })
            .catch(error => {
                console.error('Error details: ', error);
                document.getElementById('leaderboard_display').innerHTML = "<p style='color: #f85149; text-align: center;'>Failed to fetch leaderboard.</p>";
            });
    }

    // --- Math Engine & Balance Checker ---
    const chipRatioInput = document.getElementById('chip-ratio');
    const buyInAmtInput = document.getElementById('buy-in-amt');
    const liveBalanceText = document.getElementById('live-balance');
    const submitGameBtn = document.getElementById('submit-game-btn');

    function calculate_Balance() {
        const chipratio = parseFloat(chipRatioInput.value) || 5;
        const buyinamt = parseFloat(buyInAmtInput.value) || 100;
        
        let total_balance = 0;
        const rows = document.querySelectorAll('.player-row');

        rows.forEach(row => {
            const buyins = parseFloat(row.querySelector('.p-buyins').value) || 0;
            const endchips = parseFloat(row.querySelector('.p-chips').value) || 0;
            const profitLoss = (endchips / chipratio) - (buyinamt * buyins);
            total_balance += profitLoss;
        });

        total_balance = Math.round(total_balance * 100) / 100;

        if (total_balance === 0) {
            liveBalanceText.innerText = "Discrepancy: 0 (Perfect Match!)";
            liveBalanceText.style.color = "#3fb950"; 
            submitGameBtn.disabled = false;          
            submitGameBtn.innerText = "Settle Up & Save Game";
        } else {
            const chipDiscrepancy = Math.round(total_balance * chipratio);
            liveBalanceText.innerText = `Discrepancy: ${chipDiscrepancy} chips`;
            liveBalanceText.style.color = "#f85149"; 
            submitGameBtn.disabled = true;           
            submitGameBtn.innerText = "Math Doesn't Match";
        }
    }

    document.addEventListener('input', (event) => {
        if (event.target.type === 'number') {
            calculate_Balance();
        }
    });

    // --- Submit Game ---
    submitGameBtn.addEventListener('click', () => {
        const rows = document.querySelectorAll('.player-row');
        const transaction = [];
        rows.forEach(row => {
            const Playername = row.querySelector('.p-name').value.trim();
            const buyins = parseFloat(row.querySelector('.p-buyins').value) || 0;
            const endchips = parseFloat(row.querySelector('.p-chips').value) || 0;

            if (Playername !== "") {
                transaction.push({
                    name: Playername,
                    buy_ins: buyins,
                    end_chips: endchips
                });
            }
        });

        const payload = {
            group_id: currentGroupId,
            date: document.getElementById('game-date').value,
            chip_ratio: parseFloat(document.getElementById('chip-ratio').value) || 5,
            buy_in_amt: parseFloat(document.getElementById('buy-in-amt').value) || 100,
            transactions: transaction
        };

        fetch('/api/add_game', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "error") {
                alert("Error: " + data.message);
            } else {
                alert("Game saved successfully!");
                liveGameView.style.display = 'none';
                leaderboardView.style.display = 'block';
                get_leaderboard(timeframeselect.value);
                
                document.getElementById('players-container').innerHTML = '';
                add_player_row();
                add_player_row();
                calculate_Balance();
            }
        })
        .catch(err => {
            console.error("Save error:", err);
            alert("Network error saving game");
        });
    });

    // --- Timeframe Filters ---
    const timeframeselect = document.getElementById('time_frame_select');
    const customDateControls = document.getElementById('custom_date_controls');
    const applyCustomDatebtn = document.getElementById('apply_custom_date_btn');
    const startDate = document.getElementById('start_date');
    const endDate = document.getElementById('end_date');

    timeframeselect.addEventListener('change', () => {
        const selected_value = timeframeselect.value;
        if (selected_value === 'custom') {
            customDateControls.style.display = 'flex';
        } else {
            customDateControls.style.display = 'none';
            get_leaderboard(selected_value);
        }
    });

    applyCustomDatebtn.addEventListener('click', () => {
        const start = startDate.value;
        const end = endDate.value;
        if (!start || !end) {
            alert('Please select both start and end dates');
            return;
        }
        const daterange = `custom&start=${start}&end=${end}`;
        get_leaderboard(daterange);
    });

    // Initial Load
    load_groups();
</script>

</body>
</html>
