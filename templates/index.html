<!DOCTYPE html>
<html>



<head> 
    <title>Poker Tracker</title>
        <style>
        /* 1. Deep Space Background */
        body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: #0d1117; /* Deep terminal black */
                color: #c9d1d9; /* Crisp off-white text */
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
        }

        /* 2. The Input Card */
        .input-card {
                background-color: #161b22; /* Slightly elevated dark grey */
                padding: 25px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.4); /* Deeper shadows for dark mode */
                margin-bottom: 30px;
                border: 1px solid #30363d; /* Subtle metallic border */
        }

        /* 3. Sleek Inputs */
        label {
                font-weight: 600;
                font-size: 0.9em;
                color: #8b949e; /* Muted label text */
                display: block;
                margin-bottom: 5px;
        }
        input {
                width: 100%;
                padding: 10px;
                margin-bottom: 15px;
                background-color: #0d1117; /* Inset dark background for text boxes */
                border: 1px solid #30363d;
                border-radius: 6px;
                color: #c9d1d9;
                font-size: 1em;
                box-sizing: border-box;
        }
        input:focus {
                outline: none;
                border-color: #f85149; /* Sharp red glow when typing */
        }

        /* 4. Punchy Action Button */
        button {
                background-color: #da3633; /* Deep crimson */
                color: white;
                border: none;
                padding: 12px 20px;
                border-radius: 6px;
                font-size: 1em;
                font-weight: bold;
                cursor: pointer;
                width: 100%;
                transition: background-color 0.2s;
        }
        button:hover {
                background-color: #f85149; /* Brightens up when hovered */
        }

        /* 5. The Leaderboard Table */
        table {
                width: 100%;
                border-collapse: collapse;
                background-color: #161b22;
                box-shadow: 0 8px 24px rgba(0,0,0,0.4);
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid #30363d;
        }
        th, td {
                padding: 15px;
                text-align: left;
                border-bottom: 1px solid #30363d;
        }
        th {
                background-color: #0d1117;
                font-weight: 600;
                color: #8b949e;
        }
        tr:nth-child(even) {
                background-color: #1c2128; /* Subtle striping for readability */
        }
        /* Container for the dropdown and date pickers */
        .filter-container {
                text-align: center;
                margin-bottom: 20px;
        }

        /* Styling the dropdown to match your dark theme */
        #time_frame_select {
                background-color: #0d1117;
                color: #c9d1d9;
                border: 1px solid #30363d;
                padding: 8px 15px;
                border-radius: 6px;
                font-size: 1em;
        }

        /* The critical "Hidden" state and layout */
        #custom_date_controls {
                display: none; /* This keeps it hidden by default */
                justify-content: center;
                align-items: center;
                gap: 10px;
                margin-top: 15px;
        }

        /* Ensure the date inputs don't stretch to 100% width */
        #custom_date_controls input[type="date"] {
                width: auto;
                margin-bottom: 0;
        }

        #custom_date_controls button {
                width: auto;
        }
        </style>

</head>

<body> 
    <div id="leaderboard-view">

        <div class="filter-container">
        <select id="time_frame_select">
                <option value="all"> All Time </option>
                <option value="week"> Past 7 days</option>
                <option value="month"> Past 30 days</option>
                <option value="custom"> Custom date range</option>
        </select>
        <div id="custom_date_controls">
                <input type="date" id="start_date">
                <span>TO</span>
                <input type="date" id="end_date">
                <button id="apply_custom_date_btn">Apply</button>

        </div>


    </div>
        <h1 style="text-align: center;">Poker Hall of Fame 🏆</h1>
        
        <div id="leaderboard_display"> Loading leaderboard... </div>

        <button id="start-game-btn" style="position: fixed; bottom: 30px; right: 30px; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); padding: 0;">
            +
        </button>
    </div>

    <div id="live-game-view" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button id="cancel-game-btn" style="background: transparent; color: #f85149; width: auto; padding: 10px;">Cancel</button>
            <h2 style="margin: 0;">Live Session</h2>
            <div style="width: 70px;"></div> </div>

        <div class="input-card" style="margin-top: 20px;">
            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label>Date</label>
                    <input type="date" id="game-date">
                </div>
                <div style="flex: 1;">
                    <label>Ratio</label>
                    <input type="number" id="chip-ratio" value="5">
                </div>
                <div style="flex: 1;">
                    <label>Buy-in (₹)</label>
                    <input type="number" id="buy-in-amt" value="100">
                </div>
            </div>
        </div>

        <h3>Table Roster</h3>
        <div id="players-container">
            </div>

        <button id="add-player-btn" style="background: transparent; border: 2px dashed #30363d; color: #8b949e; margin-top: 10px;">
            + Seat a Player
        </button>

        <div class="input-card" style="margin-top: 30px; text-align: center; border-color: #3fb950;">
            <h3 id="live-balance" style="margin-top: 0; color: #f85149;">Discrepancy: Checking...</h3>
            <button id="submit-game-btn" style="background-color: #3fb950;" disabled>
                Math Doesn't Match
            </button>
        </div>
    </div>

    <template id="player-row-template">
        <div class="input-card player-row" style="display: flex; gap: 10px; padding: 15px; margin-bottom: 10px; align-items: center;">
            <input type="text" class="p-name" placeholder="Name" style="flex: 2; margin-bottom: 0;">
            
            <div style="flex: 1;">
                <label style="font-size: 11px;">Buy-ins</label>
                <input type="number" class="p-buyins live-input" value="1" min="1" style="margin-bottom: 0;">
            </div>
            
            <div style="flex: 1.5;">
                <label style="font-size: 11px;">End Chips</label>
                <input type="number" class="p-chips live-input" placeholder="0" style="margin-bottom: 0;">
            </div>
            
            <button class="remove-btn" style="width: auto; padding: 10px; margin-bottom: 0;">X</button>
        </div>
    </template>

  

<script>

       
        
        const leaderboardView = document.getElementById('leaderboard-view');
        const liveGameView = document.getElementById('live-game-view');
        const startGameBtn = document.getElementById('start-game-btn');
        const cancelGameBtn = document.getElementById('cancel-game-btn');

        startGameBtn.addEventListener('click',() =>{
                leaderboardView.style.display='none';
                liveGameView.style.display='block';
        });

        cancelGameBtn.addEventListener('click',() =>{
                liveGameView.style.display='none';
                leaderboardView.style.display='block';
        });


        const addPlayerBtn=document.getElementById('add-player-btn')
        const playerContainer=document.getElementById('players-container')
        const playerTemplate=document.getElementById('player-row-template')        

        function add_player_row(){
                const newrow=playerTemplate.content.cloneNode(true);

                const removebtn=newrow.querySelector('.remove-btn');
                removebtn.addEventListener('click',(event) =>{
                        event.target.closest('.player-row').remove();
                });
                playerContainer.appendChild(newrow);
        }
        addPlayerBtn.addEventListener('click',() =>{
                add_player_row();
        });
        add_player_row();
        add_player_row();


        function get_leaderboard(time_frame='all'){
                fetch( `/api/leaderboard?timeframe=${time_frame}`,{
                        method:'GET',
                })
                .then(response=>response.json())
                .then(result=>{
                        let tableHTML="<table>"
                        let headertext="All Time Winning(INR)"
                        if(time_frame=='week') headertext="Past 7 days"
                        if(time_frame=='month') headertext='Past 30 days'
                        if(time_frame=='custom') headertext='Custom Range'
                        tableHTML += `<tr><th>Rank</th> <th>Player</th><th>${headertext} </th></tr>`;

                        for(let i=0;i<result.length;i++){
                                let player=result[i];
                                let scoreColor = (player.total_winning >= 0) ? "#3fb950" : "#f85149"; // Green for positive, Red for negative
                                let emoji="";
                                if(i==0) emoji="👑";
                                if(i===1) emoji="🥈";
                                if(i===2) emoji="🥉";
                                if(i===result.length-1 && player.total_winning<0) emoji="💀"
                                tableHTML += `<tr><td>${i+1}</td><td>${player.name} ${emoji}</td><td style="color: ${scoreColor}; font-weight: bold;">${player.total_winning}</td></tr>`;
                        }
                        tableHTML+="</table>";
                        document.getElementById('leaderboard_display').innerHTML=tableHTML;
                })
                .catch(error=>{
                        console.error('Error details: ',error)
                        alert("Server error, couldn't fetch the leaderboard")


                });
                

        }
        get_leaderboard();


        const chipRatioInput=document.getElementById('chip-ratio');
        const buyInAmtInput=document.getElementById('buy-in-amt');
        const liveBalanceText=document.getElementById('live-balance');
        const submitGameBtn=document.getElementById('submit-game-btn');

        function calculate_Balance(){
                const chipratio=parseFloat(chipRatioInput.value) || 5;
                const buyinamt=parseFloat(buyInAmtInput.value) || 100;
                
                let total_balance=0;

                const rows=document.querySelectorAll('.player-row');

                rows.forEach(row=>{
                        const buyins=parseFloat(row.querySelector('.p-buyins').value) || 0;
                        const endchips=parseFloat(row.querySelector('.p-chips').value) || 0;
                        
                        const profitLoss = (endchips / chipratio) - (buyinamt * buyins);
                        total_balance += profitLoss;
                })
                total_balance=Math.round(total_balance);

                if(total_balance==0){
                        liveBalanceText.innerText = "Discrepancy: 0 (Perfect Match!)";
                        liveBalanceText.style.color = "#3fb950"; 
                        submitGameBtn.disabled = false;          
                        submitGameBtn.innerText = "Settle Up & Save Game";
                }
                else {
                        liveBalanceText.innerText = `Discrepancy: ${total_balance*chipratio}`;
                        liveBalanceText.style.color = "#f85149"; 
                        submitGameBtn.disabled = true;           
                        submitGameBtn.innerText = "Math Doesn't Match";
                }
        }
        document.addEventListener('input',(event) =>{
                if(event.target.type=='number'){
                        calculate_Balance();
                }
        });
        
        calculate_Balance();


         submitGameBtn.addEventListener('click',()=>{
             const rows=document.querySelectorAll('.player-row')
             const transaction=[]
             rows.forEach(row=>{
                const Playername=row.querySelector('.p-name').value.trim();
                const buyins=parseFloat(row.querySelector('.p-buyins').value) || 0;
                const endchips=parseFloat(row.querySelector('.p-chips').value) || 0;

                if (Playername !=="" ){
                        transaction.push({
                                name:Playername,
                                buy_ins:buyins,
                                end_chips:endchips

                        });
                }
             });
        

        const payload={
                date:document.getElementById('game-date').value,
                chip_ratio:parseFloat(document.getElementById('chip-ratio').value) || 5,
                buy_in_amt:parseFloat(document.getElementById('buy-in-amt').value) || 100,
                transactions:transaction
        }

        fetch('/api/add_game',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify(payload)
        })
        .then(response=>response.json())
        .then(data=>{
                if(data.status=="error"){
                        alert("Python rejected it");
                }
                else{
                        alert("Game saved !");
                        liveGameView.style.display='none';
                        leaderboardView.style.display='block';
                        get_leaderboard();
                        
                        document.getElementById('players-container').innerHTML='';
                        add_player_row();
                        add_player_row();
                        calculate_Balance();
                }
        });

});

        const timeframeselect=document.getElementById('time_frame_select');
        const customDateControls=document.getElementById('custom_date_controls');
        const applyCustomDatebtn=document.getElementById('apply_custom_date_btn');
        const startDate=document.getElementById('start_date');
        const endDate=document.getElementById('end_date');
        timeframeselect.addEventListener('change',() =>{
                const selected_value=timeframeselect.value;
                if(selected_value=='custom'){
                        customDateControls.style.display='flex';
                        
                }
                else{
                        customDateControls.style.display='none';
                        get_leaderboard(selected_value)
                }
                
        });
        applyCustomDatebtn.addEventListener('click',()=>{
                        const start=startDate.value;
                        const end=endDate.value;
                        if(!start || !end){
                                alert('Please select both dates');
                                return;
                        }
                        daterange=`custom&start=${start}&end=${end}`
                        get_leaderboard(daterange)
        });
</script>


</body>


</html>
